    #---------------------------------------------------------------------
    # Makefile
    #---------------------------------------------------------------------
    name ^[mM]akefile$ = make
    name ^[mM]akefile$, has kitty, X, flag f = kitty -- make
    name ^[mM]akefile$, terminal = make
    #---------------------------------------------------------------------
    # Websites
    #---------------------------------------------------------------------
    ext x?html?, has google-chrome, X, flag f = google-chrome -- "$@"
    ext x?html?, X, flag f = xdg-open "$@"
    #---------------------------------------------------------------------
    # Documents
    #---------------------------------------------------------------------
    ext pdf, has google-chrome, X, flag f = google-chrome "$@"
    ext docx?, has google-chrome, X, flag f = google-chrome "$@"
    ext sxc|xlsx?|xlt|xlw|gnm|gnumeric, has google-chrome, X, flag f = google-chrome "$@"
    ext pptx?|od[dfgpst]|docx?|sxc|xlsx?|xlt|xlw|gnm|gnumeric, has google-chrome, X, flag f = google-chrome "$@"
    ext djvu, has google-chrome, X, flag f = google-chrome "$@"
    ext epub|mobi, has google-chrome, X, flag f = google-chrome "$@"
    #---------------------------------------------------------------------
    # Image
    #---------------------------------------------------------------------
    mime ^image/svg, has mpv, X, flag f = mpv "$@"
    mime ^image, has mpv, X, flag f = mpv "$@"
    #----------------------------------------------------------------------
    # Audio
    #----------------------------------------------------------------------
    mime ^audio|ogg$, terminal, has mpv = mpv -- "$@"
    #----------------------------------------------------------------------
    # Video
    #----------------------------------------------------------------------
    mime ^video, has mpv, X, flag f = mpv -- "$@"
    mime ^video, has mpv, X, flag f = mpv --fs -- "$@"
    mime ^video, terminal, !X, has mpv  = mpv -- "$@"
    #---------------------------------------------------------------------
    # Executables
    #---------------------------------------------------------------------
    ext exe, has bash, X = bash "$1"
    ext exe = bash "$1"
    mime application/x-executable, has kitty, X, flag f = kitty -- "$1"
    mime application/x-executable, terminal = "$1"
    #----------------------------------------------------------------------
    # Script
    #----------------------------------------------------------------------
    ext sh, has kitty, X, flag f = kitty -- sh "$1"
    ext sh, terminal = sh "$1"
    ext py, has kitty, X, flag f = kitty -- python "$1"
    ext py, terminal = python "$1"
    ext rb, has kitty, X, flag f = kitty -- ruby "$1"
    ext rb, terminal = ruby "$1"
    ext js, has kitty, X, flag f = kitty -- node "$1"
    ext js, terminal = node "$1"
    ext pl, has kitty, X, flag f = kitty -- perl "$1"
    ext pl, terminal = perl "$1"
    ext php, has kitty, X, flag f = kitty -- php "$1"
    ext php, terminal = php "$1"
    #---------------------------------------------------------------------
    # Archives
    #---------------------------------------------------------------------
    ext 7z|ace|ar|arc|bz2?|cab|cpio|cpt|deb|dgc|dmg|gz|iso|jar|msi|pkg|rar|shar|tar|tgz|xar|xpi|xz|zip, has bsdtar = bsdtar -tvf "$1" | "$PAGER"
    ext 7z|ace|ar|arc|bz2?|cab|cpio|cpt|deb|dgc|dmg|gz|iso|jar|msi|pkg|rar|shar|tar|tgz|xar|xpi|xz|zip, has bsdtar = bsdtar -xvf "$1"
    #---------------------------------------------------------------------
    # Text/Code - Editieren (Sublime > nvim)
    #---------------------------------------------------------------------
    mime ^text, has subl, X, flag f = subl "$@"
    mime ^text, terminal = nvim -- "$@"
    #---------------------------------------------------------------------
    # Fallbacks
    #---------------------------------------------------------------------
    has subl, X, flag f = subl "$@"
    has xdg-open, X, flag f = xdg-open -- "$@"
    terminal = nvim -- "$@"
    else = ask
