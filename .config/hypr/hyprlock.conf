#
# ~/.config/hypr/hyprlock.conf
#
    # Sourcing
    $Scripts = ~/.config/waybar/scripts
#
    # Neue Neon-Farben:
    $background = rgb(00W0000)  # Tiefes Schwarz für maximalen Kontrast
    $foreground = rgb(00FFFF)  # Neon-Cyan
    $color0 = rgb(FF1493)  # Neon-Pink
    $color1 = rgb(FF4500)  # Neon-Orange
    $color2 = rgb(00FF00)  # Neon-Grün
    $color3 = rgb(FFD700)  # Neon-Gelb
    $color4 = rgb(1E90FF)  # Neon-Blau
    $color5 = rgb(9400D3)  # Neon-Lila
    $color6 = rgb(00CED1)  # Türkis
    $color7 = rgb(FF00FF)  # Magenta
    $color8 = rgb(00FA9A)  # Medium Spring Green
    $color9 = rgb(FF6347)  # Tomatenrot
    $color10 = rgb(ADFF2F)  # Neon-Gelbgrün
    $color11 = rgb(FF8C00)  # Dunkles Neon-Orange
    $color12 = rgb(4682B4)  # Stählernes Blau
    $color13 = rgb(32CD32)  # Limettengrün
    $color14 = rgb(00BFFF)  # Deep Sky Blue
    $color15 = rgb(8A2BE2)  # Blauviolett
    $neon_pink = rgb(255, 20, 147) # #FF1493
    $neon_green = rgb(57, 255, 20) # #39FF14
    $neon_blue = rgb(0, 191, 255) # #00BFFF
    $neon_yellow = rgb(255, 255, 0) # #FFFF00
    $neon_purple = rgb(191, 0, 255) # #BF00FF
    $neon_red = rgb(255, 0, 0) # #FF0000
    $neon_orange = rgb(255, 102, 0) # #FF6600
#
    general {
        #grace = 1
        blur_size = 11             # Stärke des Blur-Effekts
        blur_passes = 11            # Mehr Passes = glatterer Blur
        noise = 0.11               # Fügt ein leichtes Rauschen hinzu
        dim = 0.11                  # Dunkelt den Hintergrund leicht ab (0 = kein Dimmen)
        fade_on_unlock = true      # Sanfte Übergänge beim Entsperren
    }
#
    background {
        monitor =
        path = /tmp/HyprlockBG.png # current wallpaper
        #color = $color7
        blur = true  # Aktiviert den Blur-Effekt
        blur_size = 5
        blur_passes = 1 # 0 disables blurring
        noise = 0.0333
        contrast = 1.1111 # Vibrant!!!
        brightness = 0.3333
        vibrancy = 0.1111
        vibrancy_darkness = 0.1111
        fill_mode = "center"  # Möglich: "fit", "stretch", "center", "tile"
        color = rgba(0, 0, 0, 0.8) # Dunkler Hintergrund für bessere Leuchtkraft
        #shadow_passes = 3 # Mehrfache Schatten-Ebenen für stärkeren Glow
        #shadow_offset = 0, 0 # Kein Versatz, damit der Glow gleichmäßig ist
        #shadow_color = $color7
    }
#
    decoration {
        blur {
            enabled = true
            size = 33
            passes = 11
        }
        drop_shadow = true
    }
#
    # Date
    label {
        monitor =
        text = cmd[update:18000000] echo "<b> "$(date +'%A, %-d %B')" </b>"
        #color = $color12
        color = $neon_purple
        font_size = 24
        font_family = JetBrainsMono Nerd Font ExtraBold
        position = 0, -50
        halign = center
        valign = top
        shadow_passes = 3 # Mehrfache Schatten-Ebenen für stärkeren Glow
        shadow_offset = 0, 0 # Kein Versatz, damit der Glow gleichmäßig ist
        shadow_color = $neon_purple
    }
#
    # Hour-Time
    label {
        monitor =
        text = cmd[update:1000] echo "$(date +"%H")"
        #text = cmd[update:1000] echo "$(date +"%I")" #AM/PM
    	#color = rgba(255, 185, 0, .8)
        #color = $color13
        color = $neon_green
        font_size = 160
        font_family = JetBrainsMono Nerd Font ExtraBold
        position = 0, -100
        halign = center
        valign = top
        shadow_passes = 3 # Mehrfache Schatten-Ebenen für stärkeren Glow
        shadow_offset = 0, 0 # Kein Versatz, damit der Glow gleichmäßig ist
        shadow_color = $neon_green
    }
#
    # Minute-Time
    label {
        monitor =
        text = cmd[update:1000] echo "$(date +"%M")"
        #color = rgba(15, 10, 222, .8)
        #color = $color12
        color = $neon_blue
        font_size = 160
        font_family = JetBrainsMono Nerd Font ExtraBold
        position = 0, -320
        halign = center
        valign = top
        shadow_passes = 3 # Mehrfache Schatten-Ebenen für stärkeren Glow
        shadow_offset = 0, 0 # Kein Versatz, damit der Glow gleichmäßig ist
        shadow_color = $neon_blue
    }
#
    # Seconds-Time
    label {
        monitor =
        text = cmd[update:1000] echo "$(date +"%S")"
        #text = cmd[update:1000] echo "$(date +"%S %p")" #AM/PM
        #color = $color11
        color = $neon_pink
        font_size = 35
        font_family = JetBrainsMono Nerd Font ExtraBold
        position = 0, -325
        halign = center
        valign = top
        shadow_passes = 3 # Mehrfache Schatten-Ebenen für stärkeren Glow
        shadow_offset = 0, 0 # Kein Versatz, damit der Glow gleichmäßig ist
        shadow_color = $neon_pink
    }
#
    # Put a picture of choice here. Default is the current wallpaper
    image {
        monitor =
        path = ~/.config/hypr/ottomanII.jpg
        size = 222
        rounding = -1
        border_size = 1
        #border_color = $color11
        border_color = $neon_orange
        rotate = 0
        reload_time = -1
        position = 0, 280
        halign = center
        valign = bottom
        shadow_passes = 3 # Mehrfache Schatten-Ebenen für stärkeren Glow
        shadow_offset = 0, 0 # Kein Versatz, damit der Glow gleichmäßig ist
        shadow_color = $neon_orange
    }
#
    # USER
    label {
        monitor =
        text =     $USER
        color = $color13
        outline_thickness = 2
        dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
        dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
        dots_center = true
        font_size = 24
        font_family = JetBrainsMono Nerd Font ExtraBold
        position = 0, 80
        halign = center
        valign = bottom
        shadow_passes = 3 # Mehrfache Schatten-Ebenen für stärkeren Glow
        shadow_offset = 0, 0 # Kein Versatz, damit der Glow gleichmäßig ist
        shadow_color = $color13
    }
#
    # INPUT FIELD
    input-field {
        monitor =
        size = 300, 60
        outline_thickness = 3
        dots_size = 0.3 # Scale of input-field height, 0.2 - 0.8
        dots_spacing = 0.3 # Scale of dots' absolute size, 0.0 - 1.0
        dots_center = true
        outer_color = rgba(0, 0, 0, 0)
        inner_color = rgba(255, 255, 255, 0.1)
        #font_color = $color11
        font_color = $neon_orange
        fade_on_empty = false
        font_family = JetBrainsMono Nerd Font ExtraBold
        placeholder_text = <i><span foreground="##ffffffff">🔒 Type Password</span></i>
        hide_input = false
        position = 0, 180
        halign = center
        valign = bottom
        shadow_passes = 3 # Mehrfache Schatten-Ebenen für stärkeren Glow
        shadow_offset = 0, 0 # Kein Versatz, damit der Glow gleichmäßig ist
        shadow_color = $neon_orange
    }
#
    # uptime
    label {
        monitor =
        text = cmd[update:60000] echo "<b> "$(uptime -p || $Scripts/UptimeNixOS.sh)" </b>"
        #color = $color13
        color = $neon_red
        font_size = 18
        font_family = JetBrainsMono Nerd Font ExtraBold
        position = 0, 0
        halign = right
        valign = bottom
        shadow_passes = 3 # Mehrfache Schatten-Ebenen für stärkeren Glow
        shadow_offset = 0, 0 # Kein Versatz, damit der Glow gleichmäßig ist
        shadow_color = $neon_red
    }
#
    # weather edit the scripts for locations
    # weather scripts are located in ~/.config/waybar/Scripts/Weather.sh and/or Weather.py
    # see https://github.com/JaKooLit/Hyprland-Dots/wiki/TIPS#%EF%B8%8F-weather-app-related-for-waybar-and-hyprlock
    label {
        monitor =
        text = cmd[update:3600000] [ -f ~/.cache/.weather_cache ] && cat  ~/.cache/.weather_cache
        color = $color13
        font_size = 18
        font_family = JetBrainsMono Nerd Font ExtraBold
        position = 33, 33
        halign = left
        valign = bottom
        shadow_passes = 3 # Mehrfache Schatten-Ebenen für stärkeren Glow
        shadow_offset = 0, 0 # Kein Versatz, damit der Glow gleichmäßig ist
        shadow_color = $color13
    }
#
