	# ═══════════════════════════════════════
	# MPV Neon Tastenkürzel
	# ═══════════════════════════════════════

	# ─── Deine speziellen Shortcuts ───
	CTRL+2       cycle-values tone-mapping "spline" "bt.2446a" "st2094-40" ; show-text "Tone-Map"
	CTRL+b       cycle-values deband "yes" "no" ; show-text "Deband"

	# ─── Grundlegende Steuerung ───
	SPACE        cycle pause
	q            quit
	ESC          quit
	f            cycle fullscreen

	# ─── Suche (Seek) ───
	LEFT         seek -5
	RIGHT        seek 5
	UP           seek 60
	DOWN         seek -60

	# ─── Lautstärke ───
	WHEEL_UP     add volume 5
	WHEEL_DOWN   add volume -5
	m            cycle mute

	# ─── Playlist ───
	>            playlist-next
	<            playlist-prev

	# ─── OSD anzeigen ───
	o            show-progress
